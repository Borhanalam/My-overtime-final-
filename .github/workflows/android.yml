name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Extract Android Project
        run: |
          mkdir -p extracted-project

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" -d extracted-project

      - name: Find Android Project
        id: project
        run: |
          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/extracted-project" \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Prepare Gradle Wrapper
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          if [ ! -f gradlew ]; then
            echo "gradlew not found. Creating Gradle Wrapper..."
            gradle wrapper --gradle-version 8.11
          fi

          chmod +x gradlew

          echo "Gradle wrapper ready:"
          ls -la gradlew
          ls -la gradle/wrapper

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        id: apk
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AmarOvertime-debug-apk
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
