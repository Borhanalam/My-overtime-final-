name: Build Amar Overtime v1.5

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Theme + Icon APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      # 4. Find EXACT v1.5 ZIP
      - name: Find v1.5 Source ZIP
        id: source
        shell: bash
        run: |
          set -e

          ZIP="$GITHUB_WORKSPACE/AmarOvertime-v1.5-FINAL-Theme-Icon-Source.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Required ZIP not found:"
            echo "$ZIP"
            echo ""
            echo "ZIP files currently available:"
            find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          echo "Using EXACT source ZIP:"
          echo "$ZIP"

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      # 5. Extract the exact ZIP
      - name: Extract v1.5 Source
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/extracted-project"
          mkdir -p "$GITHUB_WORKSPACE/extracted-project"

          unzip -q \
            "${{ steps.source.outputs.zip }}" \
            -d "$GITHUB_WORKSPACE/extracted-project"

          echo "Extracted project:"
          find "$GITHUB_WORKSPACE/extracted-project" \
            -maxdepth 2 -type f | sort

      # 6. Set project directory
      - name: Set Android Project Directory
        id: project
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$GITHUB_WORKSPACE/extracted-project/AmarOvertime-Final"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERROR: settings.gradle not found."
            echo "Expected:"
            echo "$PROJECT_DIR/settings.gradle"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # 7. Verify NEW Icon and Theme
      - name: Verify v1.5 Theme and Icon
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING v1.5 THEME + ICON"
          echo "========================================"

          # New launcher icon
          test -f app/src/main/res/drawable-nodpi/ic_launcher.png

          # New WebView icon
          test -f app/src/main/assets/ic_launcher.png

          # Theme files
          test -f app/src/main/res/values/colors.xml
          test -f app/src/main/res/values/themes.xml
          test -f app/src/main/res/values-v31/themes.xml

          # Web UI
          test -f app/src/main/assets/style.css
          test -f app/src/main/assets/index.html

          echo ""
          echo "Launcher icon:"
          ls -lh app/src/main/res/drawable-nodpi/ic_launcher.png

          echo ""
          echo "Theme colors:"
          cat app/src/main/res/values/colors.xml

          echo ""
          echo "Theme:"
          cat app/src/main/res/values/themes.xml

          echo ""
          echo "CSS size:"
          ls -lh app/src/main/assets/style.css

          echo ""
          echo "========================================"
          echo "THEME + ICON VERIFICATION PASSED"
          echo "========================================"

      # 8. Setup Gradle
      - name: Setup Gradle 8.11
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      # 9. Prepare Gradle Wrapper
      - name: Prepare Gradle Wrapper
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          if [ ! -f gradlew ]; then
            echo "Gradle wrapper not found."
            echo "Creating Gradle wrapper..."

            gradle wrapper --gradle-version 8.11
          fi

          chmod +x gradlew

          echo "Gradle wrapper ready."

      # 10. Clean old build
      - name: Clean Previous Build
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          ./gradlew clean --no-daemon

      # 11. Build APK
      - name: Build v1.5 Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # 12. Verify APK
      - name: Verify Generated APK
        id: apk
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          APK=$(find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "========================================"
          echo "APK GENERATED SUCCESSFULLY"
          echo "========================================"
          echo "$APK"
          ls -lh "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      # 13. Upload APK
      - name: Upload v1.5 Theme + Icon APK
        uses: actions/upload-artifact@v4
        with:
          name: AmarOvertime-v1.5-FINAL-Theme-Icon
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
