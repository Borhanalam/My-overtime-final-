name: Build Amar Overtime v1.7

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build Theme + Icon APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Find AmarOvertime ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -iname 'AmarOvertime-*.zip' \
            -printf '%T@ %p\n' |
            sort -nr |
            head -n1 |
            cut -d' ' -f2-)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: AmarOvertime ZIP not found!"
            echo "Repository files:"
            ls -lah "$GITHUB_WORKSPACE"
            exit 1
          fi

          echo "Using ZIP:"
          ls -lh "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"


      - name: Extract Android Project
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/extracted-project"

          mkdir -p "$GITHUB_WORKSPACE/extracted-project"

          unzip -q \
            "${{ steps.zip.outputs.zip_file }}" \
            -d "$GITHUB_WORKSPACE/extracted-project"

          echo "Searching for Android project..."

          find "$GITHUB_WORKSPACE/extracted-project" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print


      - name: Find Android Project
        id: project
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$(
            find "$GITHUB_WORKSPACE/extracted-project" \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print -quit |
              xargs -r dirname
          )"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found!"

            find "$GITHUB_WORKSPACE/extracted-project" \
              -maxdepth 10 \
              -type f |
              sort

            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then

            echo "ERROR: app module not found!"
            exit 1
          fi

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""


      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"


      - name: Prepare Gradle Wrapper
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          if [ ! -f gradlew ]; then
            echo "Gradle wrapper not found."
            echo "Creating Gradle wrapper..."

            gradle wrapper --gradle-version 8.11
          fi

          chmod +x gradlew

          echo "Gradle version:"
          ./gradlew --version


      - name: Clean Project
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          ./gradlew clean --no-daemon


      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace


      - name: Find APK
        id: apk
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          APK_FILE="$(
            find . \
              -type f \
              -path "*/build/outputs/apk/*.apk" \
              -print -quit
          )"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated!"

            echo "Build output:"
            find . \
              -type f \
              \( -name "*.apk" -o -path "*/build/outputs/*" \) \
              -print || true

            exit 1
          fi

          echo "APK found:"
          ls -lh "$APK_FILE"

          echo "apk_file=$PWD/${APK_FILE#./}" \
            >> "$GITHUB_OUTPUT"


      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: AmarOvertime-v1.7-THEME-ICON-FINAL
          path: ${{ steps.apk.outputs.apk_file }}
          if-no-files-found: error
          retention-days: 30
