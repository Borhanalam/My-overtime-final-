name: Build Amar Overtime v1.7

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build Theme + Icon APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check v1.7 ZIP
        run: |
          ZIP_FILE="$GITHUB_WORKSPACE/AmarOvertime-v1.7-THEME-READY.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: AmarOvertime-v1.7-THEME-READY.zip not found!"
            echo "Files in repository:"
            ls -lah "$GITHUB_WORKSPACE"
            exit 1
          fi

          echo "Found:"
          ls -lh "$ZIP_FILE"

      - name: Extract v1.7 Project
        run: |
          rm -rf "$GITHUB_WORKSPACE/extracted-project"
          mkdir -p "$GITHUB_WORKSPACE/extracted-project"

          unzip -q "$GITHUB_WORKSPACE/AmarOvertime-v1.7-THEME-READY.zip" \
            -d "$GITHUB_WORKSPACE/extracted-project"

          echo "Extracted project:"
          find "$GITHUB_WORKSPACE/extracted-project" -maxdepth 5 \
            \( -name settings.gradle -o -name settings.gradle.kts \) -print

      - name: Find Android Project
        id: project
        shell: bash
        run: |
          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/extracted-project" \
            -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle was not found."
            find "$GITHUB_WORKSPACE/extracted-project" -maxdepth 8 -type f | sort
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: Android app module was not found."
            exit 1
          fi

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle 8.11
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Prepare Gradle Wrapper
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          if [ ! -f gradlew ]; then
            echo "Gradle wrapper not found. Creating it..."
            gradle wrapper --gradle-version 8.11
          fi

          chmod +x gradlew

          echo "Gradle version:"
          ./gradlew --version

      - name: Clean Project
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          ./gradlew clean --no-daemon

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK_FILE="$(find "${{ steps.project.outputs.project_dir }}/app/build/outputs/apk" \
            -type f -name "*.apk" -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            echo "Build output:"
            find "${{ steps.project.outputs.project_dir }}/app/build/outputs" \
              -maxdepth 5 -type f -print 2>/dev/null || true
            exit 1
          fi

          echo "APK found:"
          ls -lh "$APK_FILE"

          echo "apk_file=$APK_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: AmarOvertime-v1.7-THEME-ICON-FINAL
          path: ${{ steps.apk.outputs.apk_file }}
          if-no-files-found: error
          retention-days: 30
          
