name: Build Amar Overtime v1.6

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Theme + Icon APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check v1.6 ZIP
        run: |
          ZIP_FILE="$GITHUB_WORKSPACE/AmarOvertime-v1.6-READY-TO-BUILD.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: v1.6 ZIP not found!"
            echo "Repository files:"
            ls -lah
            exit 1
          fi

          echo "Using v1.6 project:"
          echo "$ZIP_FILE"

      - name: Extract v1.6 Project
        run: |
          rm -rf "$GITHUB_WORKSPACE/extracted-project"
          mkdir -p "$GITHUB_WORKSPACE/extracted-project"

          unzip -q \
            "$GITHUB_WORKSPACE/AmarOvertime-v1.6-READY-TO-BUILD.zip" \
            -d "$GITHUB_WORKSPACE/extracted-project"

          echo "Project extracted successfully."

      - name: Find Android Project
        id: project
        run: |
          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/extracted-project" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found!"
            find "$GITHUB_WORKSPACE/extracted-project" -maxdepth 5 -type f
            exit 1
          fi

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Prepare Gradle Wrapper
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          if [ ! -f gradlew ]; then
            echo "gradlew not found. Creating Gradle wrapper..."
            gradle wrapper --gradle-version 8.11
          fi

          chmod +x gradlew

      - name: Clean Project
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          ./gradlew clean --no-daemon

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find and Prepare APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          echo "Searching for APK..."

          APK=$(find . -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated!"
            echo "Searching entire project:"
            find . -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/final-apk"

          cp "$APK" \
            "$GITHUB_WORKSPACE/final-apk/AmarOvertime-v1.6-FINAL.apk"

          echo "APK prepared successfully."

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: AmarOvertime-v1.6-FINAL-Theme-Icon
          path: final-apk/AmarOvertime-v1.6-FINAL.apk
          if-no-files-found: error
