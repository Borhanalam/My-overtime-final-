name: Build Android APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Extract Android Project
        shell: bash
        run: |
          set -e

          echo "Checking repository..."

          echo "Files in repository:"
          find . -maxdepth 3 -type f \
            -not -path "./.git/*" \
            -print

          ZIP_FILE=$(find . \
            -type f \
            -iname "*.zip" \
            -not -path "./.git/*" \
            -print -quit)

          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP found:"
            echo "$ZIP_FILE"

            mkdir -p extracted-project

            unzip -o "$ZIP_FILE" -d extracted-project

            echo "ZIP extracted successfully."
          else
            echo "No ZIP file found."
          fi

      - name: Show Project Files
        shell: bash
        run: |
          echo "Searching for Android project files..."

          find . \
            -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "gradlew" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \) \
            -not -path "./.git/*" \
            -print

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          SETTINGS_FILE=$(find . \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "./.git/*" \
            -print -quit)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          fi

          if [ -z "$PROJECT_DIR" ]; then
            GRADLEW_FILE=$(find . \
              -type f \
              -name "gradlew" \
              -not -path "./.git/*" \
              -print -quit)

            if [ -n "$GRADLEW_FILE" ]; then
              PROJECT_DIR=$(dirname "$GRADLEW_FILE")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project could not be found."
            echo ""
            echo "The ZIP may not contain a complete Android Studio project."
            echo "Required file: settings.gradle or gradlew"
            exit 1
          fi

          PROJECT_DIR="${PROJECT_DIR#./}"

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Current directory:"
          pwd

          echo "Project files:"
          ls -la

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find . \
            -type f \
            -name "*.apk" \
            -not -path "./.git/*" \
            -print

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AmarOvertime-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
