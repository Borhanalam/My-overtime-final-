name: Build Android APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Setup JDK 17
      # Gradle cache intentionally disabled here because
      # the Android project is inside a subdirectory.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Find the actual Android project
      - name: Find Android Project
        shell: bash
        run: |
          set -e

          echo "Repository contents:"
          find . -maxdepth 4 -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "gradlew" \) \
            -not -path "./.git/*" \
            -print

          PROJECT_DIR=""

          if [ -f "./settings.gradle" ] || [ -f "./settings.gradle.kts" ]; then
            PROJECT_DIR="."
          else
            SETTINGS_FILE=$(find . \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -not -path "./.git/*" \
              -print -quit)

            if [ -n "$SETTINGS_FILE" ]; then
              PROJECT_DIR=$(dirname "$SETTINGS_FILE")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            GRADLEW_FILE=$(find . \
              -type f \
              -name "gradlew" \
              -not -path "./.git/*" \
              -print -quit)

            if [ -n "$GRADLEW_FILE" ]; then
              PROJECT_DIR=$(dirname "$GRADLEW_FILE")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project could not be found."
            echo "Please make sure settings.gradle or gradlew exists in the repository."
            exit 1
          fi

          PROJECT_DIR="${PROJECT_DIR#./}"

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 4. Setup Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # 5. Build Debug APK
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Building Android project from:"
          pwd

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      # 6. Find generated APK
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          find "${PROJECT_DIR}" \
            -type f \
            -name "*.apk" \
            -print

      # 7. Upload APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AmarOvertime-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
